<div id="toasts" role="status" aria-live="polite"></div>

{% if meta_pixel or clarity_id %}
<div class="cookie-banner" id="cookie-banner" role="dialog" aria-label="Cookies" aria-live="polite" hidden>
  <p>
    Usamos cookies propias para que funcione tu carrito y tu sesión, y cookies de
    <b>Meta</b> y <b>Microsoft Clarity</b> para medir nuestras campañas y mejorar la
    tienda. Podés aceptarlas o rechazarlas.
    <a href="{{ URL_WEB }}/privacidad">Más información</a>.
  </p>
  <div class="cookie-acc">
    <button type="button" class="btn-sec" onclick="cookiesElegir('no')">Rechazar</button>
    <button type="button" class="btn-grande" onclick="cookiesElegir('si')">Aceptar</button>
  </div>
</div>
<script>
  function cookiesElegir(v){
    try { localStorage.setItem('mo-cookies', v); } catch(e){}
    var b = document.getElementById('cookie-banner'); if (b) b.hidden = true;
    if (v === 'si' && window.cargarPixel) window.cargarPixel();
    if (v === 'si' && window.cargarClarity) window.cargarClarity();
  }
  (function(){
    var elegido = '';
    try { elegido = localStorage.getItem('mo-cookies') || ''; } catch(e){}
    if (elegido !== 'si' && elegido !== 'no'){
      var b = document.getElementById('cookie-banner'); if (b) b.hidden = false;
    }
  })();
</script>
{% endif %}
