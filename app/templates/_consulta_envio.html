<div class="consulta-envio" id="consulta-envio">
  <button type="button" class="ce-abrir" aria-expanded="false">🚚 ¿Cuánto sale el envío a tu zona?</button>
  <div class="ce-panel" hidden>
    <form class="ce-form" autocomplete="off">
      <input type="text" class="ce-dir" placeholder="Tu barrio o dirección y localidad" enterkeyhint="search"
             aria-label="Tu barrio o dirección">
      <button type="submit" class="btn-sec">Ver costo</button>
    </form>
    <p class="ce-res" role="status" aria-live="polite"></p>
  </div>
</div>
