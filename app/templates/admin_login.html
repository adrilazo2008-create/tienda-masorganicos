{% extends "admin_base.html" %}
{% block title %}Ingresar — Admin{% endblock %}
{% block contenido %}
<div class="login-box">
  <h1>Panel de administración</h1>
  {% if error %}<p class="err-box" tabindex="-1">{{ error }}</p>{% endif %}
  <form method="post" action="/admin/login">
    <label>Contraseña
      <input type="password" name="clave" required autofocus autocomplete="current-password">
    </label>
    <button type="submit" class="btn-grande">Entrar</button>
  </form>
</div>
{% endblock %}
