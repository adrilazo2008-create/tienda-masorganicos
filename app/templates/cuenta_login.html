{% extends "base.html" %}
{% block title %}Mi cuenta — Más Orgánicos{% endblock %}
{% block contenido %}
<div class="login-box">
  <h1>Mis pedidos</h1>
  <p>Ingresá con el celular que usaste al comprar.</p>
  {% if error %}<p class="err-box" tabindex="-1" id="login-error">{{ error }}</p>{% endif %}
  <form method="post" action="/cuenta/entrar">
    <label>Celular
      <input name="telefono" type="tel" inputmode="tel" autocomplete="tel" required>
    </label>
    <button type="submit" class="btn-grande">Ver mis pedidos</button>
  </form>
</div>
<script src="/static/js/tienda.js?v={{ V }}"></script>
{% endblock %}
