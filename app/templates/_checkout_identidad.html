{% if existe %}
  <p class="ok-box">¡Hola de nuevo, {{ cliente_encontrado.nombre }}! Ya tenemos tus datos.</p>
  <input type="hidden" name="nombre" value="{{ cliente_encontrado.nombre }}">
  <input type="hidden" name="apellido" value="{{ cliente_encontrado.apellido }}">
  <input type="hidden" name="email" value="{{ cliente_encontrado.email }}">
  <details class="mini">
    <summary>¿No sos {{ cliente_encontrado.nombre }}? Ingresá tus datos</summary>
    <div class="grid2">
      <label>Nombre <input name="nombre" autocomplete="given-name"></label>
      <label>Apellido <input name="apellido" autocomplete="family-name"></label>
    </div>
    <label>Email <input type="email" name="email" autocomplete="email" spellcheck="false"></label>
  </details>
{% else %}
  <div class="grid2">
    <label>Nombre <input name="nombre" autocomplete="given-name" required></label>
    <label>Apellido <input name="apellido" autocomplete="family-name" required></label>
  </div>
  <label>Email
    <input type="email" name="email" autocomplete="email" spellcheck="false" placeholder="para enviarte el resumen">
  </label>
  <label>PIN de 4 dígitos <small>(opcional)</small>
    <input name="pin" inputmode="numeric" maxlength="4" pattern="\d{4}" autocomplete="off" spellcheck="false" placeholder="opcional">
  </label>
{% endif %}
